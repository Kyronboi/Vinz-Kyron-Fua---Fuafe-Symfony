
services:
  fuafe_mysql:
    image: mysql:8.0
    container_name: fuafe_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - fuafe-db-data:/var/lib/mysql  # Corrected volume name
    networks:
      - fuafe-network

  fuafe_phpmyadmin:
    image: phpmyadmin
    container_name: fuafe_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: fuafe_mysql
    ports:
      - "8081:80"
    networks:
      - fuafe-network

volumes:
  fuafe-db-data:  # Corrected definition

networks:
  fuafe-network:
